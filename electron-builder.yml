appId: com.yourspotrented.desk
productName: YSR Desk
copyright: Copyright © Yourspotrented.com
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - package.json
extraResources:
  - from: resources
    to: .
asar: true
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  signAndEditExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: YSR Desk
  artifactName: YSR-Desk-Setup-${version}.${ext}
